name: iPad App Build

on:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'ios/**'
      - '.github/workflows/ipad-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ipad-build.yml'
  workflow_dispatch:

concurrency:
  group: ipad-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build iPad (Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve scheme destinations
        run: |
          xcodebuild -project CodeOSSIpad.xcodeproj -scheme CodeOSSIpad -showdestinations || true

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project CodeOSSIpad.xcodeproj \
            -scheme CodeOSSIpad \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name 'CodeOSSIpad.app' | head -n 1)
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found"
            exit 1
          fi
          ls -la "$APP_PATH"

      - name: Upload simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeOSSIpad-iphonesimulator
          path: ios/${{ steps.app.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  archive-ipa:
    name: Archive IPA (signed)
    runs-on: macos-15
    needs: build-simulator
    # Runs only when Apple signing secrets are configured on the repo.
    if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          echo "Installed provisioning profile $PP_UUID"

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project CodeOSSIpad.xcodeproj \
            -scheme CodeOSSIpad \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CodeOSSIpad.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/CodeOSSIpad.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeOSSIpad-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
